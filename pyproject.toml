[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gollerhey-promptgarden"
version = "0.1.0"
description = "维护提示词变体集合，在同一批输入上跑出对照结果并排出优劣。"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "gollerhey" }]
keywords = ["prompt", "ab-testing", "variants", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://gollerhey.github.io"
Repository = "https://github.com/gollerhey/promptgarden"
Issues = "https://github.com/gollerhey/promptgarden/issues"

[project.scripts]
promptgarden = "promptgarden:main"

[tool.setuptools]
py-modules = ["promptgarden"]
